name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install PSScriptAnalyzer
      shell: pwsh
      run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: |
        $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
        $results | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String -Width 200 | Write-Host

        $errors = $results | Where-Object Severity -eq 'Error'
        if ($errors) {
          Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)."
          exit 1
        }
        Write-Host "No PSScriptAnalyzer errors ($($results.Count) warnings/informational)."

  test:
    name: Pester tests
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Pester
      shell: pwsh
      run: Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

    - name: Run Pester
      shell: pwsh
      run: |
        $config = New-PesterConfiguration
        $config.Run.Path = './tests'
        $config.Output.Verbosity = 'Detailed'
        $config.Run.Exit = $true
        Invoke-Pester -Configuration $config
